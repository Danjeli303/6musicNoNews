services:
  hls-streamer:
    image: six-music-skipper:local
    pull_policy: build
    build:
      context: .
      target: skipper-runtime
    command: ["./radio6music_noNews_hls.sh"]
    restart: unless-stopped
    environment:
      BBC_URL: ${BBC_URL:-http://as-hls-ww-live.akamaized.net/pool_81827798/live/ww/bbc_6music/bbc_6music.isml/bbc_6music-audio%3d320000.norewind.m3u8}
      FIP_URL: ${FIP_URL:-https://stream.radiofrance.fr/fip/fip_hifi.m3u8?id=radiofrance}
      OUT_DIR: /srv/hls
      SILENCER_STATUS_FILE: /srv/hls/silencer-status.json
      FIP_VOLUME: ${FIP_VOLUME:-0.85}
      HLS_AUDIO_BITRATE: ${HLS_AUDIO_BITRATE:-128k}
      HLS_TIME: ${HLS_TIME:-6}
      HLS_LIST_SIZE: ${HLS_LIST_SIZE:-20}
      HLS_RESTART_DELAY_SECONDS: ${HLS_RESTART_DELAY_SECONDS:-1}
      HLS_CLEAN_START: ${HLS_CLEAN_START:-0}
    volumes:
      - hls_data:/srv/hls

  news-skipper-web:
    image: six-music-skipper:local
    pull_policy: build
    build:
      context: .
      target: skipper-runtime
    command: ["python3", "./skip_news_web.py", "--host", "0.0.0.0", "--port", "8080", "--output-dir", "/srv/downloads"]
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: ${TZ:-Europe/London}
      SKIP_NEWS_OUTPUT_DIR: /srv/downloads
      BBC_NOW_PLAYING_URL: ${BBC_NOW_PLAYING_URL:-https://rms.api.bbc.co.uk/v2/services/bbc_6music/segments/latest?experience=domestic&offset=0&limit=4}
      BBC_NOW_PLAYING_DELAY_SECONDS: ${BBC_NOW_PLAYING_DELAY_SECONDS:-18}
      FIP_NOW_PLAYING_URL: ${FIP_NOW_PLAYING_URL:-https://api.radiofrance.fr/livemeta/live/7/transistor_musical_player}
      SILENCER_STATUS_FILE: /srv/hls/silencer-status.json
    volumes:
      - skipper_downloads:/srv/downloads
      - hls_data:/srv/hls:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - news-skipper-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - hls_data:/srv/hls:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  hls_data:
  skipper_downloads:
  caddy_data:
  caddy_config:
